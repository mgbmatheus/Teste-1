version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ipax_db
    environment:
      POSTGRES_DB: ipax_cache
      POSTGRES_USER: ipax
      POSTGRES_PASSWORD: ipax_dev_2024
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata:
